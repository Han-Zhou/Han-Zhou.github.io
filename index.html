<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terminal - Arush Agrawal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Terminal Container -->
    <div class="terminal-container">
        <!-- Terminal Header -->
        <div class="terminal-header">
            <div class="terminal-buttons">
                <span class="terminal-button close"></span>
                <span class="terminal-button minimize"></span>
                <span class="terminal-button maximize"></span>
            </div>
            <div class="terminal-title">arush@terminal:~</div>
        </div>

        <!-- Terminal Output Area -->
        <div class="terminal-body">
            <div class="terminal-output" id="terminalOutput">
                <div class="output-line">Welcome to Arush Agrawal's Terminal</div>
                <div class="output-line">Type /help to see available commands</div>
                <div class="output-line">&nbsp;</div>
            </div>

            <!-- Terminal Input Line -->
            <div class="terminal-input-line">
                <span class="terminal-prompt">$</span>
                <input
                    type="text"
                    class="terminal-input"
                    id="terminalInput"
                    autocomplete="off"
                    spellcheck="false"
                    autofocus
                />
                <span class="cursor"></span>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
